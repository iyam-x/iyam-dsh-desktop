name: Build

# 推送 v* 标签时，自动在各平台构建安装包并上传到草稿 Release 的 Assets。
on:
  push:
    tags:
      - "v*"

# 允许工作流创建 GitHub Release 并上传产物。
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：aarch64 用 arm64 运行器，x64 用 intel 运行器（各自原生构建，不做交叉编译）
          - platform: macos-14
            args: "--target aarch64-apple-darwin"
          - platform: macos-13
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 不用 pnpm/action-setup（指定大版本范围且无 packageManager 字段时会触发
      # `pnpm store path` 失败）；直接用 npm 安装 pnpm，简单可靠。
      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev build-essential pkg-config \
            libssl-dev python3

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 拉取内置 DSH 内核（@deepseek-ai/dsh，含原生模块）与本平台 Node 运行时。
      # 必须在 tauri build 之前执行；各自下载当前平台产物。
      - name: Fetch bundled DSH + Node runtime
        run: |
          node scripts/fetch-dsh.mjs
          node scripts/fetch-node.mjs

      - name: Build with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 可选：填入以下 Secret 即可自动签名/公证 macOS 产物。留空则产出未签名包。
          # APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
          # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "iyam-dsh-desktop ${{ github.ref_name }}"
          releaseBody: "自动构建的安装包，见下方 Assets。"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
