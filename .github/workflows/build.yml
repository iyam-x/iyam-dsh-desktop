name: Build

# 推送 v* 标签时，自动在各常见桌面平台构建安装包，并上传为 Release Assets。
# 覆盖平台：
#   - macOS   (Apple Silicon, aarch64) → .dmg
#   - Windows (x64)                    → .exe (NSIS)
#   - Linux   (x64)                    → .AppImage + .deb
on:
  push:
    tags:
      - "v*"

# 允许工作流创建 GitHub Release 并上传产物。
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：仅出 Apple Silicon。GitHub 已下架 macos-13（最后的 Intel 运行器），
          # 且无托管的 x64 macOS 运行器；交叉编译 x64 需自托管 Intel 机器，故暂不出 x64。
          - platform: macos-14
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 使用 npm（与本地工具链一致）：beforeBuildCommand 为 `npm run build`，
      # 前端依赖用 npm 安装；避免 pnpm 在无 packageManager 字段时的环境不一致问题。
      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Linux 需要 Tauri 的 WebView 系统依赖才能编译/打包。
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev

      # 拉取内置 DSH 内核（@deepseek-ai/dsh，含原生模块）与本平台 Node 运行时。
      # 必须在 tauri build 之前执行；各自下载当前平台产物。
      - name: Fetch bundled DSH + Node runtime
        run: |
          node scripts/fetch-dsh.mjs
          node scripts/fetch-node.mjs

      - name: Build with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 可选：填入以下 Secret 即可自动签名/公证 macOS 产物。留空则产出未签名包。
          # APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
          # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
          # Windows 可选签名 Secret：
          # WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "iyam-dsh-desktop ${{ github.ref_name }}"
          releaseBody: "自动构建的安装包，见下方 Assets。"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
