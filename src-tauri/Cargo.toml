[package]
name = "iyam-dsh-desktop"
version = "0.1.0"
description = "DeepSeek Harness Desktop App"
authors = []
license = "MIT"
rust-version = "1.77.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
# 直接弹 toast 并接管点击激活回调（tauri-plugin-notification 丢弃了激活句柄，
# 点击通知无法把窗口带到前台）。与插件同版本，无新增编译。
notify-rust = "4"
# macOS 点击激活：notify-rust 的 wait_for_response 对"无按钮纯点击"不真正阻塞等待，
# 故 macOS 直接用它（wait_for_click）弹通知。与 notify-rust 依赖的 0.6 同版本，自动合一。
mac-notification-sys = "0.6"
# 文件内联预览：二进制读取转 base64 data URL
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
reqwest = { version = "0.12", features = ["stream", "gzip", "json"] }
semver = "1"
log = "0.4"
env_logger = "0.11"
regex = "1"
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows-only: toast 注册（AUMID/注册表）+ 系统菜单
[target.'cfg(target_os = "windows")'.dependencies]
# toast 归属/注册表登记/任务栏分组
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
